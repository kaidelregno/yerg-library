[workspace]
resolver = "2"
members = [
    "crates/yerg-core",
    "crates/yerg-player",
    "crates/yerg-scrobble",
    "crates/yerg-sync",
    "crates/yerg-cli",
    "crates/yerg-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kaidelregno/yerg-library"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
rayon = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
directories = "5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
md5 = "0.7"
ureq = { version = "2", features = ["json"] }
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.16"
deunicode = "1"
eframe = "0.32"
egui = "0.32"
egui_extras = "0.32"
rfd = "0.15"
open = "5"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
